services:
  web:
    build:
      context: .
      dockerfile: /web/Dockerfile
    container_name: garmin-web
    restart: always
    ports:
      - "5000:8080"
    environment:
      - APP_DATA_DIR=/app/data
      - GARMIN_USERNAME=${GARMIN_USERNAME}
      - GARMIN_PASSWORD=${GARMIN_PASSWORD}
      - GARMIN_START_DATE=${GARMIN_START_DATE}
      - GARMIN_END_DATE=${GARMIN_END_DATE}
      - GARMIN_REFRESH_MINUTES=${GARMIN_REFRESH_MINUTES}
      - GARMIN_MAX_ACTIVITIES=${GARMIN_MAX_ACTIVITIES}
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
    volumes:
      - garmin-data:/app/data
    healthcheck:
      test: [ "CMD-SHELL", "test -f /app/data/garmin_app.db || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  garmin-data:
